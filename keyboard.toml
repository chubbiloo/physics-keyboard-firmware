# Documentation: https://rmk.rs/docs/configuration/
[keyboard]
name = "RMK Keyboard"
product_name = "RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "rp2040"

[matrix]
# Row and col pins are mandatory
row_pins = ["PIN_5", "PIN_4", "PIN_3", "PIN_2", "PIN_1", "PIN_0"]
col_pins = ["PIN_10", "PIN_11", "PIN_12", "PIN_13", "PIN_14", "PIN_15"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 6
cols = 6
map = """
(0,0)  (0,1)  (0,2,@2u)  (0,4)  (0,5)
(1,0)  (1,1)  (1,2)  (1,3)  (1,4)  (1,5) 
(2,0)  (2,1)  (2,2)  (2,3)  (2,4)  (2,5) 
(3,0)  (3,1)  (3,2)  (3,3)  (3,4)  (3,5) 
(4,0,@2u_tall)  (4,1)  (4,2)  (4,3)  (4,4)  (4,5,@2u_tall) 
(5,1)  (5,2)  (5,3)  (5,4)   
"""

[keymap]
# One more layer than is defined below: the keymap references layer 2
# (LT(2, ...), TG(2)), which stays empty until the user fills it in.
layers = 3

[[keymap.layer]] # layer 0
keys = """
A       B           C
Kc1     Kc2         Kc3
LCtrl   MO(1)       LShift
OSL(1)  LT(2, Kc9)  LM(1, LShift | LGui)
"""

[[keymap.layer]] # layer 1
keys = """
_  TT(1)  TG(2)
_  _      _
_  _      _
_  _      _
"""
